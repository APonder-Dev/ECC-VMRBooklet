name: Build

# Compiles every push and pull request so a broken build is caught before
# release. Publishes nothing - releases stay in release.yml (tag-triggered).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Kept on v5: v6 moved its caching into a proprietary component with
      # separate terms. v5 already runs on Node 24.
      - uses: gradle/actions/setup-gradle@v5

      # Maven Central sometimes rate-limits GitHub's shared runners (HTTP 429)
      # when the dependency cache is cold - retry with a growing wait instead
      # of failing the run.
      - name: Build
        run: |
          for attempt in 1 2 3; do
            ./gradlew build --no-daemon && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build attempt $attempt failed - retrying in $((attempt * 60))s (often a temporary Maven Central rate limit)."
              sleep $((attempt * 60))
            fi
          done
          exit 1

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: vmrbooklet-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
