name: Build

# Compiles every push and pull request so a broken build is caught before
# release. Publishes nothing - releases stay in release.yml (tag-triggered).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: vmrbooklet-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
