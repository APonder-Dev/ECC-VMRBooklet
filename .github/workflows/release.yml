name: Release

# Fires on a version tag (v1.0.1, v1.0.2, ...) pushed to the repo - see
# CONTRIBUTING.md for the tagging steps. Never runs on an ordinary commit.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify tag matches gradle.properties version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROP_VERSION=$(grep -m1 '^version=' vmrbooklet/gradle.properties | cut -d= -f2)
          if [ "$TAG_VERSION" != "$PROP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION doesn't match gradle.properties version=$PROP_VERSION - bump and commit the version before tagging."
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
        id: version

      - name: Build
        working-directory: vmrbooklet
        run: ./gradlew build --no-daemon

      - name: Extract CHANGELOG.md section for this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
            }
            found { print }
          ' vmrbooklet/CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for [$VERSION] - release body will just be the auto-generated commit list."
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          # Appends GitHub's own auto-generated "What's Changed" commit/PR
          # list after the CHANGELOG section above, rather than replacing it -
          # the curated summary stays in front, the full commit list follows.
          generate_release_notes: true
          files: vmrbooklet/build/libs/*.jar
