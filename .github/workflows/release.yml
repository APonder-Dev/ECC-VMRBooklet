name: Release

# Fires on a version tag (v1.0.1, v1.0.2, ...) pushed to the repo - see
# CONTRIBUTING.md for the tagging steps. Never runs on an ordinary commit.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Same as build.yml: v5, not v6 (v6's caching has separate proprietary terms).
      - uses: gradle/actions/setup-gradle@v5

      - name: Verify tag matches gradle.properties version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROP_VERSION=$(grep -m1 '^version=' gradle.properties | cut -d= -f2)
          if [ "$TAG_VERSION" != "$PROP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION doesn't match gradle.properties version=$PROP_VERSION - bump and commit the version before tagging."
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
        id: version

      # Retried like build.yml - a Maven Central rate limit (HTTP 429) on a cold
      # cache shouldn't fail a tagged release.
      - name: Build
        run: |
          for attempt in 1 2 3; do
            ./gradlew build --no-daemon && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build attempt $attempt failed - retrying in $((attempt * 60))s (often a temporary Maven Central rate limit)."
              sleep $((attempt * 60))
            fi
          done
          exit 1

      - name: Extract CHANGELOG.md section for this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for [$VERSION] - release body will just be the auto-generated commit list."
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          # Appends GitHub's own auto-generated "What's Changed" commit/PR
          # list after the CHANGELOG section above, rather than replacing it -
          # the curated summary stays in front, the full commit list follows.
          generate_release_notes: true
          files: build/libs/*.jar
